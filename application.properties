# Goes at: src/main/resources/application.properties
# (next to KnightBackendApplication.java's package folder, not inside it)

# A real file on disk — NOT in-memory — so every account, project, and
# deployed site survives a server restart. ./data/ is created automatically.
spring.datasource.url=jdbc:h2:file:./data/knight;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Creates/updates tables automatically from the @Entity classes — fine for
# getting started; switch to a migration tool (Flyway/Liquibase) once this
# is carrying real data you can't afford to lose to a schema change.
spring.jpa.hibernate.ddl-auto=update

# Render/Railway/Fly inject PORT themselves; 8080 is the local-dev fallback.
server.port=${PORT:8080}

# Keep request/response bodies a bit larger than the Spring default, since a
# deploy payload can be a whole bundled website (up to ~3MB, enforced in code).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Production (Postgres) — uncomment once you have a managed database ---
# Also uncomment the postgresql dependency in pom.xml first.
# spring.datasource.url=${DATABASE_URL}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
