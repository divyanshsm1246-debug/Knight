# Local development: a file database in ./data (created automatically).
# On a real host set the DATABASE_URL environment variable to a Postgres
# connection string and Knight switches to it automatically (see
# PostgresDataSourceConfig in KnightBackendApplication.java). Free hosts wipe
# local files whenever the service sleeps, so do NOT rely on this H2 file there.
spring.datasource.url=jdbc:h2:file:./data/knight;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No explicit dialect: Hibernate detects H2 vs Postgres from the connection.
spring.jpa.hibernate.ddl-auto=update

# Hosts inject PORT; 8080 is the local fallback.
server.port=${PORT:8080}
