spring.datasource.url=jdbc:h2:file:./data/knight;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# One port for the REST API AND the WebSocket (/ws/knight). Change it here, or run: PORT=8081 mvn spring-boot:run
server.port=${PORT:8080}

# Allow localhost front-ends on any port (5500, 3000, 5173...). Add real sites in KNIGHT_ALLOWED_ORIGINS.
# Keep idle WebSocket connections open (the client also pings every 25s).
server.tomcat.connection-timeout=60s
