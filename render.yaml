services:
  - type: web
    name: knight-realmes
    # Java has no package.json for Render to auto-detect, so we use a Docker
    # image. The Dockerfile in this repo is three lines and pins the JDK.
    runtime: docker
    plan: free
    # NOTE ON SLOW FIRST REQUESTS: Render's free plan spins the service down
    # after ~15 minutes with no traffic. The next request then cold-starts the
    # container, which can take 30-60s. If the browser gives up before that
    # finishes you'll see a network failure with no clean HTTP status. The
    # delay only goes away on a paid plan, or by hitting the URL yourself to
    # "warm" it before real traffic.
    healthCheckPath: /api/health
    envVars:
      # generateValue makes Render create this ONCE and keep it fixed. That
      # matters enormously: if JWT_SECRET ever changes, every token already in
      # every user's browser becomes invalid at once and everybody is silently
      # signed out. Never set this by hand to a new value on a live service.
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
    # Render's free web services use an EPHEMERAL filesystem — data.json would
    # be wiped on every redeploy or restart, taking all accounts with it. This
    # disk is what makes "sign up, come back next week, still signed in" true
    # rather than just true-until-the-next-deploy. DATA_DIR above points the
    # storage layer at it.
    disks:
      - name: knight-data
        mountPath: /data
        sizeGB: 1
